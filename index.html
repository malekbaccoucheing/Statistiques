function f3(){const p=V('p3'),N=2000,x=cv('c3'),b=Math.log10(N),y0=Math.max(0,p-.25),y1=Math.min(1,p+.25),A=ax(x,0,b,y0,y1),cl=['#2E6DAD','#c0392b','#1A6B3A','#b9770e','#7d3c98'],e=[];

const G=[[`Une usine fabrique des pièces dont une proportion \\(p\\) est défectueuse, inconnue en vrai. On contrôle \\(n\\) pièces et on estime \\(p\\) par la proportion observée \\(\\hat p\\). Mais un autre contrôle donnerait un autre \\(\\hat p\\) : <b>\\(\\hat p\\) est aléatoire</b>. Le simulateur refait 3000 contrôles. \\[\\hat p=\\overline X_n=\\frac1n\\sum_{k=1}^{n}X_k,\\qquad \\mathbb E(\\hat p)=p,\\qquad \\operatorname{Var}(\\hat p)=\\frac{p(1-p)}{n}\\]`,`Axe horizontal : valeur de \\(\\hat p\\) obtenue. Barres : fréquence des contrôles ayant donné cette valeur. Courbe rouge : loi théorique. Pointillés verts : vraie valeur \\(p\\).`,[`<b>\\(p\\)</b> : la vraie proportion de défectueuses (fixée ici pour tester l'estimateur ; en pratique on l'ignore).`,`<b>\\(n\\)</b> : nombre de pièces contrôlées à chaque contrôle.`,`<b>Relancer</b> : refait 3000 contrôles avec de nouveaux tirages.`],[`Prenez \\(n=20\\) puis \\(n=800\\) : l'histogramme se resserre autour de \\(p\\). L'écart-type diminue en \\(1/\\sqrt n\\).`,`Vérifiez que la moyenne des \\(\\hat p\\) est proche de \\(p\\) : l'estimateur est <b>sans biais</b>.`,`Comparez l'écart-type mesuré et l'écart-type théorique \\(\\sqrt{p(1-p)/n}\\) indiqués dans le résultat.`]],[`Un même paramètre peut s'estimer de plusieurs façons. Ici, loi uniforme sur \\([0\\,;\\theta]\\) avec \\(\\theta=1\\) (inconnu du statisticien). On compare \\(2\\overline X_n\\) (moments), \\(M_n=\\max_k X_k\\) (maximum de vraisemblance) et \\(\\frac{n+1}{n}M_n\\) (corrigé du biais). Le <b>risque quadratique</b> mesure la qualité globale : \\[R(\\hat\\theta,\\theta)=\\mathbb E\\big[(\\hat\\theta-\\theta)^2\\big]=\\operatorname{Var}(\\hat\\theta)+\\big(\\mathbb E\\hat\\theta-\\theta\\big)^2,\\qquad R(2\\overline X_n)=\\frac{\\theta^2}{3n},\\quad R(M_n)=\\frac{2\\theta^2}{(n+1)(n+2)}\\] La dernière ligne du résultat compare deux estimateurs de la variance d'une \\(\\mathcal N(0,4)\\) : \\(V_n\\) (division par \\(n\\)) et \\(S_n^2\\) (division par \\(n-1\\)).`,`Axe horizontal : valeur de l'estimation de \\(\\theta\\) (vraie valeur 1 = trait gris). Chaque couleur est l'histogramme de 3000 estimations.`,[`<b>\\(n\\)</b> : taille de chaque échantillon utilisé pour calculer une estimation.`,`<b>Relancer</b> : 3000 nouveaux échantillons.`],[`Où est centré chaque histogramme par rapport au trait gris ? Bleu et vert : centrés (sans biais). Rouge : décalé à gauche (biais).`,`Regardez la largeur : le rouge est très étroit, le bleu très étalé. Le rouge, pourtant biaisé, a un risque plus petit.`,`Augmentez \\(n\\) : le risque de \\(M_n\\) diminue en \\(1/n^2\\), celui de \\(2\\overline X_n\\) seulement en \\(1/n\\).`,`Dernière ligne : \\(V_n\\) sous-estime \\(4\\), alors que \\(\\mathbb E[S_n^2]=4\\).`]],[`Que se passe-t-il quand on accumule des observations ? On contrôle les pièces une à une et on recalcule \\(\\hat p_n\\) après chaque pièce. La loi des grands nombres affirme que l'estimateur est <b>convergent</b> : \\[\\hat p_n=\\frac1n\\sum_{k=1}^{n}X_k\\ \\xrightarrow[n\\to+\\infty]{}\\ p\\]`,`Axe horizontal : nombre \\(n\\) de pièces contrôlées (échelle logarithmique, \\(1\\to2000\\)). Axe vertical : \\(\\hat p_n\\). Chaque couleur est une histoire indépendante. Rouge : vraie valeur \\(p\\). Gris : bande \\(\\pm1{,}96\\sqrt{p(1-p)/n}\\).`,[`<b>\\(p\\)</b> : vraie proportion de défectueuses.`,`<b>Nouvelles trajectoires</b> : recommence 5 histoires indépendantes.`],[`Au début (\\(n\\) petit) les courbes sont dispersées ; elles finissent par se coller à la ligne rouge : c'est la convergence.`,`Elles restent presque toujours dans la bande grise, qui rétrécit en \\(1/\\sqrt n\\).`,`Relancez plusieurs fois : les trajectoires changent mais finissent toujours au même endroit.`]],[`Principe du maximum de vraisemblance : parmi toutes les valeurs possibles de \\(p\\), on retient celle qui rend les données observées les <i>moins surprenantes</i>. On observe \\(S\\) pièces défectueuses sur \\(n\\) : \\[L(p)=p^{S}(1-p)^{n-S},\\qquad \\ell(p)=\\ln L(p)=S\\ln p+(n-S)\\ln(1-p),\\qquad \\hat p=\\frac{S}{n}\\] \\(L(p)\\) est la probabilité d'obtenir exactement ces données si la proportion valait \\(p\\).`,`Axe horizontal : valeur candidate de \\(p\\). Graphique du haut : \\(L(p)\\) divisée par son maximum. Graphique du bas : \\(\\ln L(p)\\) ramenée à 0 au maximum. Pointillés rouges : \\(\\hat p=S/n\\).`,[`<b>\\(n\\)</b> : nombre de pièces contrôlées.`,`<b>\\(S/n\\)</b> : part de défectueuses dans l'échantillon observé (donc \\(S=n\\times\\) cette valeur).`],[`Le sommet est toujours exactement en \\(S/n\\) : l'estimateur du maximum de vraisemblance est la proportion observée.`,`Augmentez \\(n\\) sans toucher à \\(S/n\\) : le pic devient plus étroit. Plus de données \\(\\Rightarrow\\) plus de certitude sur \\(p\\).`,`Comparez les deux graphes : le maximum est au même endroit ; \\(\\ln L\\) est une cloche concave, plus simple à dériver.`]],[`Un intervalle de confiance encadre la moyenne inconnue \\(\\mu\\) (ici \\(\\mu=10\\) et \\(\\sigma=2\\), que l'utilisateur ne connaît pas en vrai) : \\[\\Big[\\overline X_n-q\\,\\frac{s}{\\sqrt n}\\ ,\\ \\overline X_n+q\\,\\frac{s}{\\sqrt n}\\Big],\\qquad q=z_{1-\\alpha/2}\\ \\text{(normale)}\\ \\text{ou}\\ t_{n-1;\\,1-\\alpha/2}\\ \\text{(Student)}\\] (avec \\(\\sigma\\) à la place de \\(s\\) quand \\(\\sigma\\) est connu). Le niveau \\(1-\\alpha=95\\,\\%\\) ne signifie pas « \\(\\mu\\) est dans CET intervalle avec 95 % de chances » : c'est la <b>méthode</b> qui capture \\(\\mu\\) dans 95 % des échantillons. Le simulateur construit 40 intervalles à partir de 40 échantillons indépendants.`,`Chaque trait horizontal est un intervalle calculé sur un échantillon. Pointillés : vraie valeur \\(\\mu=10\\). Trait bleu : l'intervalle contient \\(\\mu\\) ; trait rouge : il la rate.`,[`<b>\\(n\\)</b> : taille de chaque échantillon (plus grand \\(\\Rightarrow\\) intervalles plus étroits).`,`<b>Niveau</b> : probabilité visée de capturer \\(\\mu\\) (plus élevé \\(\\Rightarrow\\) intervalles plus larges).`,`<b>Méthode</b> : « \\(\\sigma\\) connu » utilise le quantile de la loi normale ; « Student ✔ » estime \\(\\sigma\\) par \\(s\\) et utilise le quantile de Student (correct) ; « quantile normal ✘ » estime \\(\\sigma\\) par \\(s\\) mais garde la normale (erreur fréquente).`,`<b>Nouveaux tirages</b> : refait 40 échantillons.`],[`Comptez les traits rouges : environ 5 sur 100 à 95 %, donc \\(\\approx2\\) sur 40.`,`Comparez la « couverture réelle » (3000 tirages) au niveau annoncé : elles coïncident pour les deux premières méthodes.`,`Mettez \\(n=4\\) avec « quantile normal ✘ » : la couverture réelle tombe nettement sous le niveau annoncé. Student corrige cela.`,`Passez le niveau de 90 % à 99 % : les traits s'allongent.`]],[`Une machine doit remplir des bouteilles de 500 mL (\\(\\sigma=4\\) mL connu). On soupçonne un sous-remplissage : \\(H_0:\\mu=500\\) contre \\(H_1:\\mu\\lt 500\\). On mesure la moyenne \\(\\overline X_n\\) de \\(n\\) bouteilles et on rejette \\(H_0\\) si elle est inférieure à un seuil \\(c\\) : \\[c=500-z_{1-\\alpha}\\,\\frac{\\sigma}{\\sqrt n},\\qquad \\alpha=\\mathbb P_{H_0}(\\overline X_n\\lt c),\\qquad 1-\\beta=\\mathbb P_{\\mu_1}(\\overline X_n\\lt c)=\\Phi\\Big(\\frac{c-\\mu_1}{\\sigma/\\sqrt n}\\Big)\\] Deux erreurs possibles : rejeter \\(H_0\\) à tort (probabilité <b>\\(\\alpha\\)</b>) ou ne pas détecter un vrai sous-remplissage (probabilité <b>\\(\\beta\\)</b>). La <b>puissance</b> est \\(1-\\beta\\).`,`Axe horizontal : valeur de la moyenne \\(\\overline X_n\\) observée. Courbe bleue : sa loi si la machine est bien réglée (\\(\\mu=500\\)). Courbe rouge : sa loi si la vraie moyenne est \\(\\mu_1\\). Pointillés : seuil \\(c\\) (on rejette à gauche). Aire bleue \\(=\\alpha\\) ; aire rouge à droite du seuil \\(=\\beta\\).`,[`<b>\\(n\\)</b> : nombre de bouteilles mesurées.`,`<b>\\(\\alpha\\)</b> : risque accepté de rejeter \\(H_0\\) à tort ; il fixe la position du seuil \\(c\\).`,`<b>\\(\\mu_1\\)</b> : le vrai réglage de la machine (inconnu en pratique). 500 = machine correcte ; plus bas = sous-remplissage.`,`<b>Tirer un échantillon</b> : simule UNE mesure de \\(n\\) bouteilles et applique la règle de décision.`],[`Éloignez \\(\\mu_1\\) de 500 : les deux courbes se séparent, \\(\\beta\\) diminue et la puissance monte.`,`Augmentez \\(n\\) : les courbes s'affinent et se séparent, \\(\\beta\\) diminue sans changer \\(\\alpha\\).`,`Passez \\(\\alpha\\) de 5 % à 1 % : \\(\\alpha\\) diminue mais \\(\\beta\\) augmente. On ne peut pas tout gagner à \\(n\\) fixé.`,`Avec \\(\\mu_1=499{,}5\\), cliquez plusieurs fois sur « Tirer un échantillon » : on rate souvent le sous-remplissage (puissance faible).`]],[`Certaines fonctions (la log-vraisemblance, l'erreur d'un réseau de neurones) n'ont pas de minimum calculable à la main : on le cherche pas à pas. <b>Descente de gradient</b> : on avance dans le sens opposé à la pente. <b>Newton</b> : on remplace \\(f\\) par sa parabole locale et on saute à son minimum. 15 itérations sont simulées. \\[\\theta_{k+1}=\\theta_k-\\eta\\,f'(\\theta_k)\\quad\\text{(gradient)},\\qquad \\theta_{k+1}=\\theta_k-\\frac{f'(\\theta_k)}{f''(\\theta_k)}\\quad\\text{(Newton)}\\]`,`Axe horizontal : \\(\\theta\\). Courbe bleue : \\(f(\\theta)\\). Point vert : départ \\(\\theta_0\\). Points rouges : itérations successives, reliées par un trait.`,[`<b>Fonction</b> : \\(\\theta^2\\) a un seul minimum (en 0) ; la fonction non convexe a deux creux (un minimum local, un minimum global).`,`<b>Méthode</b> : descente de gradient ou Newton.`,`<b>\\(\\eta\\)</b> : longueur du pas de la descente (sans effet sur Newton).`,`<b>\\(\\theta_0\\)</b> : point de départ.`],[`Sur \\(\\theta^2\\) avec descente : \\(\\eta=0{,}1\\) converge lentement ; \\(\\eta=0{,}5\\) tombe sur 0 en une étape ; \\(\\eta=1{,}1\\) diverge.`,`Passez à Newton sur \\(\\theta^2\\) : une seule étape suffit.`,`Fonction non convexe : essayez \\(\\theta_0=-2\\) puis \\(\\theta_0=2\\) : on tombe dans des creux différents. Un minimum local n'est pas forcément le meilleur.`,`Pas trop grand \\(\\Rightarrow\\) divergence ; pas trop petit \\(\\Rightarrow\\) lenteur.`]],[`On veut estimer une moyenne (vraie valeur 4) en ne regardant qu'<b>une observation à la fois</b> (descente de gradient stochastique). À chaque nouvelle observation \\(z_k\\), on corrige l'estimation : \\[\\theta_k=\\theta_{k-1}-\\eta_k\\,(\\theta_{k-1}-z_k)\\] Avec \\(\\eta_k=1/k\\), \\(\\theta_k\\) est exactement la moyenne empirique \\(\\overline Z_k\\). Le choix du pas \\(\\eta\\) décide de la stabilité.`,`Axe horizontal : numéro \\(k\\) de l'observation (1 à 60). Points gris : observations. Courbes : estimation \\(\\theta_k\\). Trait gris : vraie moyenne 4.`,[`<b>Pas constant (rouge)</b> : \\(\\eta\\) fixe. Grand = réagit vite mais très bruité ; petit = lisse mais lent.`,`<b>Nouveaux tirages</b> : génère 60 nouvelles observations.`],[`La courbe bleue (pas \\(1/k\\)) est exactement la moyenne des observations déjà vues : elle se stabilise.`,`La rouge avec \\(\\eta=0{,}5\\) saute à chaque observation et s'agite autour de 4.`,`Avec \\(\\eta=0{,}02\\) elle est très lisse mais met longtemps à rejoindre 4.`,`Lisez la dispersion des 20 dernières itérations dans le résultat.`]],[`Les 80 points proviennent de deux sous-populations (centrées sur 0 et 4, écart-type 1), mais on ignore laquelle a produit chaque point. L'algorithme EM estime les deux moyennes \\(m_1\\) et \\(m_2\\) en répétant : \\[\\textbf{(E)}\\ \\ \\gamma_{ik}=\\frac{\\pi_k f_k(x_i)}{\\pi_1 f_1(x_i)+\\pi_2 f_2(x_i)},\\qquad \\textbf{(M)}\\ \\ m_k=\\frac{\\sum_i\\gamma_{ik}\\,x_i}{\\sum_i\\gamma_{ik}}\\] \\(\\gamma_{ik}\\) est la probabilité que le point \\(i\\) appartienne au groupe \\(k\\) ; chaque moyenne est une moyenne pondérée par ces \\(\\gamma\\).`,`Axe horizontal : valeur des observations. Barres grises : histogramme des données. Courbes bleue et rouge : les deux composantes ; noire : le mélange. Points du bas : observations colorées selon \\(\\gamma_{i1}\\) (bleu = groupe 1, rouge = groupe 2).`,[`<b>\\(m_1,\\ m_2\\)</b> (départ) : valeurs initiales supposées des deux moyennes (bouger un curseur remet l'algorithme à zéro).`,`<b>Générer des données</b> : nouvel échantillon de 80 points.`,`<b>1 itération / 10 itérations</b> : applique les étapes E puis M une ou dix fois.`],[`Cliquez plusieurs fois sur « 1 itération » : les courbes bleue et rouge glissent vers les deux nuages de points.`,`Observez les couleurs : les points entre les deux groupes sont mélangés (\\(\\gamma\\) proche de 0,5).`,`La log-vraisemblance ne fait qu'augmenter.`,`Essayez des départs identiques (\\(m_1=m_2\\)) : l'algorithme reste bloqué, car tous les points sont attribués à parts égales.`]]];
G.push(...[[`Les tests et intervalles gaussiens reposent sur deux lois : <b>Student</b> \\(t(\\nu)=\\dfrac{Z}{\\sqrt{V/\\nu}}\\) (pour la moyenne quand \\(\\sigma\\) est inconnu) et <b>khi-deux</b> \\(\\chi^2(\\nu)=Z_1^2+\\dots+Z_\\nu^2\\) (pour la variance). Ici on les trace et on lit leurs quantiles, comme dans les tables A.2 et A.3 du cours.`,`Axe horizontal : valeur \\(x\\). Bleu : normale (ou khi-deux). Rouge : Student, avec en rouge clair les queues de 2,5 % chacune. Survolez le graphique pour lire densités et probabilités.`,[`<b>Loi</b> : Student comparée à la normale, ou khi-deux seule.`,`<b>\\(\\nu\\)</b> : nombre de degrés de liberté (en pratique \\(n-1\\)).`],[`Student avec \\(\\nu=2\\) puis \\(\\nu=30\\) : les queues épaisses disparaissent, la courbe rejoint la normale (quantile \\(1{,}960\\)).`,`Comparez le quantile de Student au quantile normal : voilà pourquoi on utilise Student quand \\(\\sigma\\) est inconnu.`,`Khi-deux : la loi est asymétrique, d'espérance \\(\\nu\\) ; il faut donc lire <i>deux</i> quantiles (bas et haut).`]],[`On mesure \\(n\\) pièces et on veut juger leur régularité (variance \\(\\sigma^2\\)). Le khi-deux fournit à la fois un <b>intervalle de confiance</b> pour \\(\\sigma^2\\) et un <b>test</b> de \\(H_0:\\sigma^2=\\sigma_0^2\\) contre \\(H_1:\\sigma^2>\\sigma_0^2\\) avec \\(K=\\frac{(n-1)s^2}{\\sigma_0^2}\\sim\\chi^2(n-1)\\) sous \\(H_0\\). Le scénario « Exemple du cours » reproduit \\(n=15\\), \\(s^2=7{,}1\\).`,`Axe horizontal : valeur de \\(K\\). Courbe : loi \\(\\chi^2(n-1)\\) sous \\(H_0\\). Aire rouge : zone de rejet (5 %). Trait vert : \\(K\\) observé.`,[`<b>\\(n\\)</b> : nombre de mesures.`,`<b>\\(s^2\\)</b> : variance corrigée observée.`,`<b>\\(\\sigma_0^2\\)</b> : valeur de référence testée.`],[`Augmentez \\(s^2\\) : le trait vert avance vers la zone de rejet.`,`Diminuez \\(n\\) : l'intervalle de confiance s'élargit et devient très asymétrique.`,`Vérifiez la cohérence : \\(\\sigma_0^2\\) hors de l'intervalle correspond à un rejet (test bilatéral).`]],[`Deux méthodes pour estimer la borne \\(\\theta\\) d'une loi \\(\\mathcal U([0,\\theta])\\) : les moments (\\(2\\overline X_n\\)) et le maximum de vraisemblance. Ici la vraisemblance n'est pas dérivable : elle est nulle avant \\(\\max_k x_k\\) puis décroît, donc le maximum est <i>au bord</i>.`,`Axe horizontal : valeur candidate de \\(\\theta\\). Courbe : \\(L(\\theta)/L_{\\max}\\). Points : les observations. Rouge : EMV \\(=\\max_k x_k\\). Orange : EMM \\(=2\\overline x\\). Vert : vraie valeur.`,[`<b>\\(n\\)</b> : taille de l'échantillon.`,`<b>\\(\\theta\\)</b> : vraie borne (inconnue en pratique).`,`<b>Nouvel échantillon</b> : retire des observations.`],[`La courbe saute de 0 à son maximum en \\(\\max_k x_k\\) : aucune dérivée nulle, \\(\\ell'(\\theta)=-n/\\theta\\) ne s'annule jamais.`,`L'EMM tombe parfois <i>en dessous</i> du maximum observé : valeur impossible. L'EMV ne commet jamais cette erreur.`,`Relancez plusieurs fois : l'EMV sous-estime toujours \\(\\theta\\) (biais), mais il est bien plus proche.`]],[`La <b>puissance</b> \\(1-\\beta\\) est la probabilité de détecter un vrai sous-remplissage. Elle dépend de l'écart \\(500-\\mu_1\\) et de la taille \\(n\\). Quatre tailles d'échantillon sont tracées en même temps (machine : \\(\\sigma=4\\), test \\(H_1:\\mu\\lt 500\\)).`,`Axe horizontal : vraie moyenne \\(\\mu_1\\). Axe vertical : puissance. Chaque couleur est une taille \\(n\\). Pointillés gris : puissance de 90 %. Trait vertical : \\(\\mu_1\\) choisi.`,[`<b>\\(\\alpha\\)</b> : niveau du test.`,`<b>\\(\\mu_1\\)</b> : vraie moyenne dont on lit la puissance pour chaque \\(n\\).`],[`En \\(\\mu_1=500\\), toutes les courbes valent \\(\\alpha\\) : on ne détecte rien si la machine est correcte.`,`Plus \\(n\\) est grand, plus la courbe monte vite : un petit écart devient détectable.`,`Repérez, pour un écart donné (\\(\\mu_1=499\\)), quelle taille \\(n\\) atteint 90 %.`]]]);
