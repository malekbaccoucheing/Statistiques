</head><body>
<h1>🔬 Labo de statistique inférentielle</h1>
<p class="sub">Tout le cours en simulations. Pour chaque onglet : 1) lisez « De quoi parle-t-on ? », 2) manipulez les paramètres décrits, 3) suivez les points « Sur quoi vous concentrer ». Le résultat chiffré se met à jour à chaque changement.</p>
<nav id="nav"></nav><div id="main"></div>
<script>
const $=i=>document.getElementById(i),V=i=>+$(i).value,css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const f=(v,d=3)=>(+v).toFixed(d).replace('.',','),mean=a=>a.reduce((u,v)=>u+v,0)/a.length;
const rn=()=>Math.sqrt(-2*Math.log(1-Math.random()))*Math.cos(6.283185*Math.random());
const pdf=(v,m,s)=>Math.exp(-0.5*((v-m)/s)**2)/(s*2.5066283);
const Phi=z=>{const t=1/(1+.3275911*Math.abs(z)/1.41421356),y=1-[1.061405429,-1.453152027,1.421413741,-.284496736,.254829592].reduce((a,c)=>a*t+c)*t*Math.exp(-z*z/2);return .5*(1+(z<0?-y:y))};
const zq=p=>{if(p<.5)return-zq(1-p);const t=Math.sqrt(-2*Math.log(1-p));return t-(2.515517+.802853*t+.010328*t*t)/(1+1.432788*t+.189269*t*t+.001308*t**3)};
const tq=(p,v)=>{const z=zq(p);return z+(z**3+z)/(4*v)+(5*z**5+16*z**3+3*z)/(96*v*v)+(3*z**7+19*z**5+17*z**3-15*z)/(384*v**3)};
function cv(id){const c=$(id),h=+c.dataset.h||260,d=devicePixelRatio||1;c.style.height=h+'px';const w=c.clientWidth||600;c.width=w*d;c.height=h*d;const x=c.getContext('2d');x.scale(d,d);x.W=w;x.H=h;return x}
function ax(x,x0,x1,y0,y1,nq){const T=12,B=x.H-26,L=46,Rr=x.W-12,X=v=>L+(v-x0)/(x1-x0)*(Rr-L),Y=v=>B-(Math.min(Math.max(v,y0),y1)-y0)/(y1-y0)*(B-T);
x.strokeStyle=x.fillStyle=css('--mu');x.lineWidth=1;x.setLineDash([]);x.beginPath();x.moveTo(L,T);x.lineTo(L,B);x.lineTo(Rr,B);x.stroke();x.font='11px sans-serif';
for(let i=0;i<=5;i++){const v=x0+(x1-x0)*i/5;x.fillText(+v.toPrecision(3),X(v)-12,B+14)}if(!nq)for(let i=0;i<=4;i++){const v=y0+(y1-y0)*i/4;x.fillText(+v.toPrecision(2),2,Y(v)+4);x.globalAlpha=.15;x.beginPath();x.moveTo(L,Y(v));x.lineTo(Rr,Y(v));x.stroke();x.globalAlpha=1}return{X,Y,T,B}}
function ln(x,A,g,a,b,c,fl){x.beginPath();for(let i=0;i<=160;i++){const v=a+(b-a)*i/160;i?x.lineTo(A.X(v),A.Y(g(v))):x.moveTo(A.X(v),A.Y(g(v)))}
if(c){x.strokeStyle=c;x.lineWidth=2;x.setLineDash([]);x.stroke()}if(fl){x.lineTo(A.X(b),A.B);x.lineTo(A.X(a),A.B);x.fillStyle=fl;x.fill()}}
function vl(x,A,v,c,d){x.strokeStyle=c;x.lineWidth=1.5;x.setLineDash(d?[5,4]:[]);x.beginPath();x.moveTo(A.X(v),A.T);x.lineTo(A.X(v),A.B);x.stroke();x.setLineDash([])}
function hc(a,lo,hi,k){const d=Array(k).fill(0);a.forEach(v=>{const j=Math.floor((v-lo)/(hi-lo)*k);if(j>=0&&j<k)d[j]++});return d.map(c=>c/a.length/((hi-lo)/k))}
function bars(x,A,d,lo,hi,c){const w=(hi-lo)/d.length;x.fillStyle=c;d.forEach((h,j)=>{const a=A.X(lo+j*w),b=A.X(lo+(j+1)*w);x.fillRect(a,A.Y(h),b-a-1,A.B-A.Y(h))})}
function lg(x,a){x.canvas.previousElementSibling.innerHTML=a.map(([t,c])=>`<span style="color:${c}">■ ${t}</span>`).join('')}
function pl(x,A,P,c){x.strokeStyle=c;x.lineWidth=2;x.setLineDash([]);x.beginPath();P.forEach((v,i)=>i?x.lineTo(A.X(i+1),A.Y(v)):x.moveTo(A.X(1),A.Y(v)));x.stroke()}
const BL='#2E6DAD',RO='#c0392b',VE='#1A6B3A';
/* ---------- 1 : estimateur ---------- */
function f1(){const p=V('p1'),n=V('n1'),R=3000,a=[];for(let r=0;r<R;r++){let s=0;for(let i=0;i<n;i++)s+=Math.random()<p;a.push(s/n)}
const m=mean(a),sd=Math.sqrt(mean(a.map(v=>(v-m)**2))),th=Math.sqrt(p*(1-p)/n),lo=Math.max(0,p-4.5*th-.005),hi=Math.min(1,p+4.5*th+.005),H=hc(a,lo,hi,32),x=cv('c1'),A=ax(x,lo,hi,0,Math.max(...H,1/th/2.5)*1.1);
bars(x,A,H,lo,hi,'rgba(46,109,173,.5)');ln(x,A,v=>pdf(v,p,th),lo,hi,RO);vl(x,A,p,VE,1);lg(x,[['histogramme de \\(\\hat p\\) (3000 contrôles)',BL],['courbe : loi approchée \\(\\mathcal N\\big(p,\\tfrac{p(1-p)}{n}\\big)\\)',RO],['pointillés : vraie valeur \\(p\\)',VE]]);
$('o1').innerHTML=`Un seul contrôle de ${n} pièces donnerait \\(\\hat p\\) = <b>${f(a[0],3)}</b>. Sur 3000 contrôles : moyenne des \\(\\hat p\\) = <b>${f(m,4)}</b> (vraie valeur ${f(p,2)}), écart-type = <b>${f(sd,4)}</b> (théorie \\(\\sqrt{p(1-p)/n}\\) = ${f(th,4)}).`}
/* ---------- 2 : biais / risque ---------- */
function f2(){const n=V('n2'),R=3000,E1=[],E2=[],E3=[];for(let r=0;r<R;r++){let s=0,m=0;for(let i=0;i<n;i++){const u=Math.random();s+=u;m=Math.max(m,u)}E1.push(2*s/n);E2.push(m);E3.push(m*(n+1)/n)}
const lo=.3,hi=1.7,H=[E1,E2,E3].map(a=>hc(a,lo,hi,56)),x=cv('c2'),A=ax(x,lo,hi,0,Math.max(...H[0])*2.6),rk=a=>mean(a.map(v=>(v-1)**2));
['rgba(46,109,173,.5)','rgba(192,57,43,.5)','rgba(26,107,58,.5)'].forEach((c,i)=>bars(x,A,H[i],lo,hi,c));vl(x,A,1,'#888',1);
lg(x,[['\\(2\\overline X_n\\) (EMM, sans biais)',BL],['\\(M_n=\\max_k X_k\\) (EMV, biaisé)',RO],['\\(\\tfrac{n+1}{n}M_n\\) (corrigé)',VE]]);
let vs=0,ss=0;for(let r=0;r<2000;r++){const z=Array.from({length:n},()=>2*rn()),m=mean(z),q=z.reduce((u,v)=>u+(v-m)**2,0);vs+=q/n;ss+=q/(n-1)}
$('o2').innerHTML=`<b>Uniforme \\([0,1]\\), \\(n=${n}\\)</b> — risque quadratique empirique (théorie) :<br>\\(2\\overline X_n\\) : ${f(rk(E1),5)} (${f(1/(3*n),5)}) · \\(M_n\\) : ${f(rk(E2),5)} (${f(2/((n+1)*(n+2)),5)}) · \\(\\tfrac{n+1}{n}M_n\\) : ${f(rk(E3),5)} (${f(1/(n*(n+2)),5)})<br>Moyenne de \\(M_n\\) = ${f(mean(E2),4)} (théorie \\(\\tfrac{n}{n+1}\\) = ${f(n/(n+1),4)}) : biais \\(\\approx-\\tfrac{1}{n+1}\\).<br><b>Variance d'une \\(\\mathcal N(0,4)\\)</b> : \\(\\mathbb E[V_n]\\approx\\) ${f(vs/2000,3)} (théorie ${f(4*(n-1)/n,3)}), \\(\\mathbb E[S_n^2]\\approx\\) ${f(ss/2000,3)} (théorie 4).`}
/* ---------- 3 : convergence ---------- */
function f3(){const p=V('p3'),N=2000,x=cv('c3'),b=Math.log10(N),y0=Math.max(0,p-.25),y1=Math.min(1,p+.25),A=ax(x,0,b,y0,y1),cl=['#2E6DAD','#c0392b','#1A6B3A','#b9770e','#7d3c98'],e=[];
[1,-1].forEach(s=>ln(x,A,v=>p+s*1.96*Math.sqrt(p*(1-p)/10**v),0,b,'#888'));ln(x,A,()=>p,0,b,RO);
for(let r=0;r<5;r++){x.strokeStyle=cl[r];x.lineWidth=1.3;x.beginPath();let s=0;for(let n=1;n<=N;n++){s+=Math.random()<p;const X=A.X(Math.log10(n)),Y=A.Y(s/n);n>1?x.lineTo(X,Y):x.moveTo(X,Y)}x.stroke();e.push(f(s/N,4))}
lg(x,[['5 trajectoires de \\(\\hat p_n\\) (abscisse : \\(\\log_{10}n\\))',BL],['gris : bande p ± 1,96·\\(\\sqrt{p(1-p)/n}\\)',css('--mu')],['rouge : vraie valeur \\(p\\)',RO]]);
$('o3').innerHTML=`\\(\\hat p\\) à \\(n=2000\\) pour les 5 trajectoires : ${e.join(' ; ')}. Écart-type théorique : ${f(Math.sqrt(p*(1-p)/N),4)}. Pour diviser l'incertitude par 10, il faut 100 fois plus de données.`}
/* ---------- 4 : vraisemblance ---------- */
function f4(){const n=V('n4'),S=Math.max(1,Math.min(n-1,Math.round(n*V('q4')))),ph=S/n,l=p=>S*Math.log(p)+(n-S)*Math.log(1-p),lm=l(ph),lo=Math.max(.001,ph-.3),hi=Math.min(.999,ph+.3);
let x=cv('c4a'),A=ax(x,lo,hi,0,1.1);ln(x,A,p=>Math.exp(l(p)-lm),lo,hi,BL,'rgba(46,109,173,.2)');vl(x,A,ph,RO,1);lg(x,[['vraisemblance \\(L(p)/L(\\hat p)\\)',BL]]);
x=cv('c4b');A=ax(x,lo,hi,-15,.5);ln(x,A,p=>l(p)-lm,lo,hi,VE);vl(x,A,ph,RO,1);lg(x,[['log-vraisemblance \\(\\ell(p)-\\ell(\\hat p)\\) : concave, maximum en \\(\\hat p=S/n\\)',VE]]);
$('o4').innerHTML=`\\(n=${n}\\), \\(S=${S}\\) succès : l'EMV est <b>\\(\\hat p=S/n=\\) ${f(ph,3)}</b>. Courbure \\(\\ell''(\\hat p)=-\\tfrac{n}{\\hat p(1-\\hat p)}=\\) ${f(-n/(ph*(1-ph)),1)} ; le pic a une largeur \\(\\approx1/\\sqrt{|\\ell''|}=\\) <b>${f(Math.sqrt(ph*(1-ph)/n),4)}</b> : c'est l'erreur standard qui servira aux intervalles de confiance.`}
/* ---------- 5 : intervalles ---------- */
function ci(n,md,l){let s=0,q=0;const z=[];for(let i=0;i<n;i++){const v=10+2*rn();z.push(v);s+=v}const m=s/n;z.forEach(v=>q+=(v-m)**2);const sd=Math.sqrt(q/(n-1)),p=1-(1-l)/2,h=(md==1?tq(p,n-1):zq(p))*(md==0?2:sd)/Math.sqrt(n);return[m-h,m+h]}
function f5(){const n=V('n5'),md=+$('m5').value,l=+$('l5').value,x=cv('c5'),A=ax(x,6,14,0,41,1);let ok=0,c=0;
for(let i=1;i<=40;i++){const[a,b]=ci(n,md,l),h=a<=10&&10<=b;ok+=h;x.strokeStyle=h?BL:RO;x.lineWidth=2.5;x.beginPath();x.moveTo(A.X(a),A.Y(i));x.lineTo(A.X(b),A.Y(i));x.stroke()}
vl(x,A,10,css('--fg'),1);for(let i=0;i<3000;i++){const[a,b]=ci(n,md,l);c+=a<=10&&10<=b}
$('o5').innerHTML=`Vrai \\(\\mu=10\\) (pointillés). <b>${ok}/40</b> intervalles le contiennent (rouge = raté). Sur 3000 tirages, couverture réelle = <b>${f(c/30,1)} %</b> pour un niveau annoncé de ${f(l*100,0)} %.`+(md==2&&n<30?' <b>→ Trop faible : avec s estimé il faut le quantile de Student, pas celui de la normale.</b>':'')}
/* ---------- 6 : tests ---------- */
function f6(){const n=V('n6'),al=+$('a6').value,m1=V('m6'),sd=4/Math.sqrt(n),c=500-zq(1-al)*sd,lo=m1-4*sd,hi=500+4*sd,x=cv('c6'),pw=Phi((c-m1)/sd),f0=v=>pdf(v,500,sd),f1=v=>pdf(v,m1,sd),A=ax(x,lo,hi,0,Math.max(f0(500),f1(m1))*1.2);
ln(x,A,f0,lo,hi,BL);ln(x,A,f1,lo,hi,RO);ln(x,A,f0,lo,c,null,'rgba(46,109,173,.5)');ln(x,A,f1,c,hi,null,'rgba(192,57,43,.4)');vl(x,A,c,css('--fg'),1);
lg(x,[['loi de \\(\\overline X_n\\) sous \\(H_0\\) (\\(\\mu=500\\)) ; aire bleue \\(=\\alpha\\)',BL],['loi de \\(\\overline X_n\\) si \\(\\mu=\\mu_1\\) ; aire rouge \\(=\\beta\\)',RO],['pointillés : seuil de rejet \\(c\\) (on rejette si \\(\\overline X_n<c\\))',css('--fg')]]);
let r0=0,r1=0;for(let i=0;i<4000;i++){r0+=500+sd*rn()<c;r1+=m1+sd*rn()<c}
$('o6').innerHTML=`Seuil \\(c=\\) ${f(c,3)} · <b>puissance \\(1-\\beta=\\) ${f(pw,3)}</b> (simulée : ${f(r1/4000,3)}) · \\(\\beta=\\) ${f(1-pw,3)} · \\(\\alpha\\) simulé = ${f(r0/4000,3)}.`+(m1<500?` Taille nécessaire pour 90 % de puissance : <b>\\(n\\ge\\) ${Math.ceil(((zq(1-al)+1.2816)*4/(500-m1))**2)}</b>.`:' (\\(\\mu_1=\\mu_0\\) : la puissance vaut \\(\\alpha\\).)');$('o6b').innerHTML=''}
function s6(){const n=V('n6'),m1=V('m6'),al=+$('a6').value,sd=4/Math.sqrt(n),c=500-zq(1-al)*sd,xb=m1+sd*rn();$('o6b').innerHTML=`Un échantillon tiré avec \\(\\mu=${m1}\\) : \\(\\bar x=\\) <b>${f(xb,2)}</b> → ${xb<c?'<b>on rejette \\(H_0\\)</b>':'on ne rejette pas \\(H_0\\) (erreur de 2e espèce possible !)'}.`}
/* ---------- 7 : descente / Newton ---------- */
const FN=[[t=>t*t,t=>2*t,t=>2],[t=>t**4-2*t*t+.5*t,t=>4*t**3-4*t+.5,t=>12*t*t-4]];
function f7(){const[g,d,h]=FN[$('f7').value],eta=V('e7'),nw=$('m7').value==1;let t=V('t7');const P=[t];
for(let k=0;k<15;k++){const hh=Math.abs(h(t))<1e-6?1e-6:h(t);t=nw?t-d(t)/hh:t-eta*d(t);if(!isFinite(t)||Math.abs(t)>50)break;P.push(t)}
const ys=Array.from({length:100},(_,i)=>g(-2.3+4.6*i/99)),x=cv('c7'),A=ax(x,-2.3,2.3,Math.min(...ys)-.3,Math.max(...ys)+.3);ln(x,A,g,-2.3,2.3,BL);
x.strokeStyle=RO;x.lineWidth=1.5;x.beginPath();P.forEach((v,i)=>i?x.lineTo(A.X(v),A.Y(g(v))):x.moveTo(A.X(v),A.Y(g(v))));x.stroke();
P.forEach((v,i)=>{x.fillStyle=i?RO:VE;x.beginPath();x.arc(A.X(v),A.Y(g(v)),i?3:6,0,7);x.fill()});lg(x,[['courbe de \\(f\\) ; vert = départ \\(\\theta_0\\), rouge = itérés',RO]]);
$('o7').innerHTML=`\\(\\theta_0,\\dots,\\theta_5\\) : ${P.slice(0,6).map(v=>f(v,3)).join(' → ')}<br>${P.length<16?'<b>Divergence !</b> ':''}Après ${P.length-1} itérations : \\(\\theta=\\) <b>${f(P[P.length-1],4)}</b>, \\(f(\\theta)=\\) ${f(g(P[P.length-1]),4)}.`+(nw&&$('f7').value==0?' Newton résout la quadratique en <b>une seule étape</b>.':'')+($('f7').value==1?' Selon le départ, on tombe dans le minimum local ou global.':'')}
/* ---------- 8 : SGD ---------- */
let D=[];function g8(){D=Array.from({length:60},()=>4+2*rn());f8()}
function f8(){const c=V('sg'),x=cv('c8'),A=ax(x,1,60,-1,9);let t1=0,t2=0;const P1=[],P2=[];
D.forEach((z,i)=>{t1-=(t1-z)/(i+1);t2-=c*(t2-z);P1.push(t1);P2.push(t2);x.fillStyle='rgba(120,130,150,.6)';x.beginPath();x.arc(A.X(i+1),A.Y(z),2.5,0,7);x.fill()});
ln(x,A,()=>4,1,60,'#888');pl(x,A,P1,BL);pl(x,A,P2,RO);lg(x,[['points gris : observations \\(\\mathcal N(4,2^2)\\)',css('--mu')],['bleu : pas \\(\\eta_k=1/k\\) (= moyenne empirique)',BL],['rouge : pas constant \\(\\eta=\\) '+c,RO]]);
const sd=a=>{const l=a.slice(-20),m=mean(l);return Math.sqrt(mean(l.map(v=>(v-m)**2)))};
$('o8').innerHTML=`\\(\\theta_{60}\\) : ${f(t1,3)} (pas \\(1/k\\)) contre ${f(t2,3)} (pas constant). Dispersion sur les 20 dernières itérations : ${f(sd(P1),3)} contre <b>${f(sd(P2),3)}</b> — un pas constant reste bruité, un pas décroissant se stabilise.`}
/* ---------- 9 : EM ---------- */
let E={x:[],m1:1,m2:2.5,it:0};
function gen(){E.x=Array.from({length:80},(_,i)=>(i%2?4:0)+rn());r9()}
function r9(){E.m1=V('i1');E.m2=V('i2');E.it=0;f9()}
function step(k){for(;k--;){let s1=0,g1=0,s2=0,g2=0;E.x.forEach(v=>{const a=pdf(v,E.m1,1),b=pdf(v,E.m2,1),g=a/(a+b);g1+=g;s1+=g*v;g2+=1-g;s2+=(1-g)*v});if(g1>1e-9&&g2>1e-9){E.m1=s1/g1;E.m2=s2/g2}E.it++}f9()}
function f9(){const x=cv('c9'),lo=-4,hi=10,A=ax(x,lo,hi,0,.45);bars(x,A,hc(E.x,lo,hi,28),lo,hi,'rgba(120,130,150,.35)');
ln(x,A,v=>.5*pdf(v,E.m1,1),lo,hi,BL);ln(x,A,v=>.5*pdf(v,E.m2,1),lo,hi,RO);ln(x,A,v=>.5*pdf(v,E.m1,1)+.5*pdf(v,E.m2,1),lo,hi,css('--fg'));

const S=[
['Estimateur','1 · Fluctuation d\'un estimateur','§1.2–1.3','Une estimation est un <i>nombre</i> qui change d\'un échantillon à l\'autre : l\'estimateur p̂ = X̄ est une <i>variable aléatoire</i>. Ici on répète 3000 fois le contrôle de n pièces.',rg('p1','Vraie proportion \\(p\\)',.01,.99,.01,.07)+rg('n1','Taille \\(n\\)',5,1000,5,200)+bt('Relancer','f1()'),cs('c1'),'o1','Le centre reste en p (sans biais). La largeur diminue en 1/√n : n×4 ⇒ écart-type ÷2.'],
['Biais & risque','2 · Biais, variance, risque quadratique','§1.3 et 1.7','Risque = variance + biais². Un estimateur <b>biaisé</b> (le maximum M) peut battre un estimateur sans biais (2X̄) ; V<sub>n</sub> sous-estime σ², S<sub>n</sub>² non.',rg('n2','Taille \\(n\\)',2,60,1,10)+bt('Relancer','f2()'),cs('c2',280),'o2','Le bleu est centré sur θ=1 mais étalé ; le rouge est décalé à gauche mais très concentré. Corriger le biais (vert) donne le meilleur des trois.'],
['Convergence','3 · Convergence (loi des grands nombres)','§1.4','Cinq trajectoires de p̂ₙ calculées au fil de n observations (échelle logarithmique). Elles se resserrent dans la bande ±1,96σ/√n.',rg('p3','Vraie proportion \\(p\\)',.02,.98,.01,.07)+bt('Nouvelles trajectoires','f3()'),cs('c3',280),'o3','La convergence est lente : en 1/√n. Chaque trajectoire finit dans la bande, comme annoncé par le théorème.'],
['Vraisemblance','4 · Maximum de vraisemblance (Bernoulli)','§1.6','Pour S succès sur n, L(p) = p<sup>S</sup>(1−p)<sup>n−S</sup>. L\'EMV est le p qui rend les données les moins surprenantes.',rg('n4','Taille \\(n\\)',5,500,5,200)+rg('q4','Proportion observée \\(S/n\\)',.02,.98,.01,.07),cs('c4a',190)+cs('c4b',190),'o4','Le maximum de L et de ln L est au même endroit. Plus n est grand, plus la courbe est pointue : on est plus sûr de p.'],
['Intervalles de confiance','5 · Intervalles de confiance et niveau','§1.8–1.9','40 échantillons N(10, 2²) donnent 40 intervalles. Le niveau 95 % est la proportion d\'intervalles qui contiennent μ <i>si l\'on répète la procédure</i>.',rg('n5','Taille \\(n\\)',4,100,1,8)+sl('l5','Niveau',[[.9,'90 %'],[.95,'95 %'],[.99,'99 %']]).replace('<option value=0.9','<option value=0.9')+sl('m5','Méthode',[[0,'σ connu (loi normale)'],[1,'σ inconnu (Student) ✔'],[2,'σ inconnu, quantile normal ✘']])+bt('Nouveaux tirages','f5()'),cs('c5',300),'o5','Choisissez « quantile normal ✘ » avec n petit : la couverture tombe sous le niveau annoncé. Student corrige cela. Plus de confiance ⇒ intervalles plus larges.'],
['Tests','6 · Tests : \\(\\alpha\\), \\(\\beta\\) et puissance','§1.10','Embouteillage : H₀ : μ=500 contre H₁ : μ<500, σ=4. Déplacez la vraie valeur μ₁ et observez les deux types d\'erreur.',rg('n6','Taille \\(n\\)',5,200,1,25)+sl('a6','Niveau \\(\\alpha\\)',[[.01,'1 %'],[.05,'5 %'],[.1,'10 %']]).replace('value=0.05>','value=0.05 selected>')+rg('m6','Vraie moyenne \\(\\mu_1\\)',496,500,.1,498)+bt('Tirer un échantillon','s6()'),cs('c6',280),'o6','<span id=o6b></span><br>Baisser α augmente β (asymétrie). Seul n permet de baisser les deux. Plus μ₁ est loin de 500, plus la puissance est grande.'],
['Descente de gradient','7 · Optimisation : descente de gradient et Newton','Chap. 2','θ<sub>k+1</sub> = θ<sub>k</sub> − η f\'(θ<sub>k</sub>). Sur θ², la suite converge ssi 0 < η < 1. Newton utilise aussi la hessienne.',sl('f7','Fonction',[[0,'θ² (convexe)'],[1,'θ⁴−2θ²+0,5θ (non convexe)']])+sl('m7','Méthode',[[0,'Descente de gradient'],[1,'Newton']])+rg('e7','Pas \\(\\eta\\)',.01,1.2,.01,.1)+rg('t7','Départ \\(\\theta_0\\)',-2,2,.1,1.5),cs('c7',280),'o7','Essayez η=0,5 (une étape), η=1,1 (divergence), et sur la fonction non convexe changez θ₀ : minimum local ≠ global.'],
['SGD','8 · Descente de gradient stochastique','Chap. 2','Estimer une moyenne avec la perte ½(θ−z)² et une observation par pas. Avec η<sub>k</sub> = 1/k, on retrouve exactement la moyenne empirique.',sl('sg','Pas constant (rouge)',[[.5,'η = 0,5'],[.1,'η = 0,1'],[.02,'η = 0,02']])+bt('Nouveaux tirages','g8()'),cs('c8',280),'o8','Un grand pas réagit vite mais reste bruité ; un petit pas lisse mais s\'ajuste lentement. Le pas 1/k fait les deux.'],
['Algorithme EM','9 · Algorithme EM (mélange de deux gaussiennes)','Chap. 2','Les étiquettes sont cachées. (E) : calculer γᵢₖ = P(Zᵢ=k | xᵢ). (M) : moyennes pondérées. σ=1 et π=½ sont connus.',rg('i1','Départ \\(m_1\\)',-3,8,.5,1)+rg('i2','Départ \\(m_2\\)',-3,8,.5,2.5)+bt('Générer des données','gen()')+bt('1 itération','step(1)')+bt('10 itérations','step(10)'),cs('c9',300),'o9','Chaque itération rapproche chaque composante de « son » groupe de points, et la log-vraisemblance augmente. Essayez de mauvais départs.']];

const G=[[`Une usine fabrique des pièces dont une proportion \\(p\\) est défectueuse, inconnue en vrai. On contrôle \\(n\\) pièces et on estime \\(p\\) par la proportion observée \\(\\hat p\\). Mais un autre contrôle donnerait un autre \\(\\hat p\\) : <b>\\(\\hat p\\) est aléatoire</b>. Le simulateur refait 3000 contrôles. \\[\\hat p=\\overline X_n=\\frac1n\\sum_{k=1}^{n}X_k,\\qquad \\mathbb E(\\hat p)=p,\\qquad \\operatorname{Var}(\\hat p)=\\frac{p(1-p)}{n}\\]`,`Axe horizontal : valeur de \\(\\hat p\\) obtenue. Barres : fréquence des contrôles ayant donné cette valeur. Courbe rouge : loi théorique. Pointillés verts : vraie valeur \\(p\\).`,[`<b>\\(p\\)</b> : la vraie proportion de défectueuses (fixée ici pour tester l'estimateur ; en pratique on l'ignore).`,`<b>\\(n\\)</b> : nombre de pièces contrôlées à chaque contrôle.`,`<b>Relancer</b> : refait 3000 contrôles avec de nouveaux tirages.`],[`Prenez \\(n=20\\) puis \\(n=800\\) : l'histogramme se resserre autour de \\(p\\). L'écart-type diminue en \\(1/\\sqrt n\\).`,`Vérifiez que la moyenne des \\(\\hat p\\) est proche de \\(p\\) : l'estimateur est <b>sans biais</b>.`,`Comparez l'écart-type mesuré et l'écart-type théorique \\(\\sqrt{p(1-p)/n}\\) indiqués dans le résultat.`]],[`Un même paramètre peut s'estimer de plusieurs façons. Ici, loi uniforme sur \\([0\\,;\\theta]\\) avec \\(\\theta=1\\) (inconnu du statisticien). On compare \\(2\\overline X_n\\) (moments), \\(M_n=\\max_k X_k\\) (maximum de vraisemblance) et \\(\\frac{n+1}{n}M_n\\) (corrigé du biais). Le <b>risque quadratique</b> mesure la qualité globale : \\[R(\\hat\\theta,\\theta)=\\mathbb E\\big[(\\hat\\theta-\\theta)^2\\big]=\\operatorname{Var}(\\hat\\theta)+\\big(\\mathbb E\\hat\\theta-\\theta\\big)^2,\\qquad R(2\\overline X_n)=\\frac{\\theta^2}{3n},\\quad R(M_n)=\\frac{2\\theta^2}{(n+1)(n+2)}\\] La dernière ligne du résultat compare deux estimateurs de la variance d'une \\(\\mathcal N(0,4)\\) : \\(V_n\\) (division par \\(n\\)) et \\(S_n^2\\) (division par \\(n-1\\)).`,`Axe horizontal : valeur de l'estimation de \\(\\theta\\) (vraie valeur 1 = trait gris). Chaque couleur est l'histogramme de 3000 estimations.`,[`<b>\\(n\\)</b> : taille de chaque échantillon utilisé pour calculer une estimation.`,`<b>Relancer</b> : 3000 nouveaux échantillons.`],[`Où est centré chaque histogramme par rapport au trait gris ? Bleu et vert : centrés (sans biais). Rouge : décalé à gauche (biais).`,`Regardez la largeur : le rouge est très étroit, le bleu très étalé. Le rouge, pourtant biaisé, a un risque plus petit.`,`Augmentez \\(n\\) : le risque de \\(M_n\\) diminue en \\(1/n^2\\), celui de \\(2\\overline X_n\\) seulement en \\(1/n\\).`,`Dernière ligne : \\(V_n\\) sous-estime \\(4\\), alors que \\(\\mathbb E[S_n^2]=4\\).`]],[`Que se passe-t-il quand on accumule des observations ? On contrôle les pièces une à une et on recalcule \\(\\hat p_n\\) après chaque pièce. La loi des grands nombres affirme que l'estimateur est <b>convergent</b> : \\[\\hat p_n=\\frac1n\\sum_{k=1}^{n}X_k\\ \\xrightarrow[n\\to+\\infty]{}\\ p\\]`,`Axe horizontal : nombre \\(n\\) de pièces contrôlées (échelle logarithmique, 1 → 2000). Axe vertical : \\(\\hat p_n\\). Chaque couleur est une histoire indépendante. Rouge : vraie valeur \\(p\\). Gris : bande \\(\\pm1{,}96\\sqrt{p(1-p)/n}\\).`,[`<b>\\(p\\)</b> : vraie proportion de défectueuses.`,`<b>Nouvelles trajectoires</b> : recommence 5 histoires indépendantes.`],[`Au début (\\(n\\) petit) les courbes sont dispersées ; elles finissent par se coller à la ligne rouge : c'est la convergence.`,`Elles restent presque toujours dans la bande grise, qui rétrécit en \\(1/\\sqrt n\\).`,`Relancez plusieurs fois : les trajectoires changent mais finissent toujours au même endroit.`]],[`Principe du maximum de vraisemblance : parmi toutes les valeurs possibles de \\(p\\), on retient celle qui rend les données observées les <i>moins surprenantes</i>. On observe \\(S\\) pièces défectueuses sur \\(n\\) : \\[L(p)=p^{S}(1-p)^{n-S},\\qquad \\ell(p)=\\ln L(p)=S\\ln p+(n-S)\\ln(1-p),\\qquad \\hat p=\\frac{S}{n}\\] \\(L(p)\\) est la probabilité d'obtenir exactement ces données si la proportion valait \\(p\\).`,`Axe horizontal : valeur candidate de \\(p\\). Graphique du haut : \\(L(p)\\) divisée par son maximum. Graphique du bas : \\(\\ln L(p)\\) ramenée à 0 au maximum. Pointillés rouges : \\(\\hat p=S/n\\).`,[`<b>\\(n\\)</b> : nombre de pièces contrôlées.`,`<b>\\(S/n\\)</b> : part de défectueuses dans l'échantillon observé (donc \\(S=n\\times\\) cette valeur).`],[`Le sommet est toujours exactement en \\(S/n\\) : l'estimateur du maximum de vraisemblance est la proportion observée.`,`Augmentez \\(n\\) sans toucher à \\(S/n\\) : le pic devient plus étroit. Plus de données ⇒ plus de certitude sur \\(p\\).`,`Comparez les deux graphes : le maximum est au même endroit ; \\(\\ln L\\) est une cloche concave, plus simple à dériver.`]],[`Un intervalle de confiance encadre la moyenne inconnue \\(\\mu\\) (ici \\(\\mu=10\\) et \\(\\sigma=2\\), que l'utilisateur ne connaît pas en vrai) : \\[\\Big[\\overline X_n-q\\,\\frac{s}{\\sqrt n}\\ ,\\ \\overline X_n+q\\,\\frac{s}{\\sqrt n}\\Big],\\qquad q=z_{1-\\alpha/2}\\ \\text{(normale)}\\ \\text{ou}\\ t_{n-1;\\,1-\\alpha/2}\\ \\text{(Student)}\\] (avec \\(\\sigma\\) à la place de \\(s\\) quand \\(\\sigma\\) est connu). Le niveau \\(1-\\alpha=95\\,\\%\\) ne signifie pas « \\(\\mu\\) est dans CET intervalle avec 95 % de chances » : c'est la <b>méthode</b> qui capture \\(\\mu\\) dans 95 % des échantillons. Le simulateur construit 40 intervalles à partir de 40 échantillons indépendants.`,`Chaque trait horizontal est un intervalle calculé sur un échantillon. Pointillés : vraie valeur \\(\\mu=10\\). Trait bleu : l'intervalle contient \\(\\mu\\) ; trait rouge : il la rate.`,[`<b>\\(n\\)</b> : taille de chaque échantillon (plus grand ⇒ intervalles plus étroits).`,`<b>Niveau</b> : probabilité visée de capturer \\(\\mu\\) (plus élevé ⇒ intervalles plus larges).`,`<b>Méthode</b> : « \\(\\sigma\\) connu » utilise le quantile de la loi normale ; « Student ✔ » estime \\(\\sigma\\) par \\(s\\) et utilise le quantile de Student (correct) ; « quantile normal ✘ » estime \\(\\sigma\\) par \\(s\\) mais garde la normale (erreur fréquente).`,`<b>Nouveaux tirages</b> : refait 40 échantillons.`],[`Comptez les traits rouges : environ 5 sur 100 à 95 %, donc ≈ 2 sur 40.`,`Comparez la « couverture réelle » (3000 tirages) au niveau annoncé : elles coïncident pour les deux premières méthodes.`,`Mettez \\(n=4\\) avec « quantile normal ✘ » : la couverture réelle tombe nettement sous le niveau annoncé. Student corrige cela.`,`Passez le niveau de 90 % à 99 % : les traits s'allongent.`]],[`Une machine doit remplir des bouteilles de 500 mL (\\(\\sigma=4\\) mL connu). On soupçonne un sous-remplissage : \\(H_0:\\mu=500\\) contre \\(H_1:\\mu<500\\). On mesure la moyenne \\(\\overline X_n\\) de \\(n\\) bouteilles et on rejette \\(H_0\\) si elle est inférieure à un seuil \\(c\\) : \\[c=500-z_{1-\\alpha}\\,\\frac{\\sigma}{\\sqrt n},\\qquad \\alpha=\\mathbb P_{H_0}(\\overline X_n<c),\\qquad 1-\\beta=\\mathbb P_{\\mu_1}(\\overline X_n<c)=\\Phi\\Big(\\frac{c-\\mu_1}{\\sigma/\\sqrt n}\\Big)\\] Deux erreurs possibles : rejeter \\(H_0\\) à tort (probabilité <b>\\(\\alpha\\)</b>) ou ne pas détecter un vrai sous-remplissage (probabilité <b>\\(\\beta\\)</b>). La <b>puissance</b> est \\(1-\\beta\\).`,`Axe horizontal : valeur de la moyenne \\(\\overline X_n\\) observée. Courbe bleue : sa loi si la machine est bien réglée (\\(\\mu=500\\)). Courbe rouge : sa loi si la vraie moyenne est \\(\\mu_1\\). Pointillés : seuil \\(c\\) (on rejette à gauche). Aire bleue \\(=\\alpha\\) ; aire rouge à droite du seuil \\(=\\beta\\).`,[`<b>\\(n\\)</b> : nombre de bouteilles mesurées.`,`<b>\\(\\alpha\\)</b> : risque accepté de rejeter \\(H_0\\) à tort ; il fixe la position du seuil \\(c\\).`,`<b>\\(\\mu_1\\)</b> : le vrai réglage de la machine (inconnu en pratique). 500 = machine correcte ; plus bas = sous-remplissage.`,`<b>Tirer un échantillon</b> : simule UNE mesure de \\(n\\) bouteilles et applique la règle de décision.`],[`Éloignez \\(\\mu_1\\) de 500 : les deux courbes se séparent, \\(\\beta\\) diminue et la puissance monte.`,`Augmentez \\(n\\) : les courbes s'affinent et se séparent, \\(\\beta\\) diminue sans changer \\(\\alpha\\).`,`Passez \\(\\alpha\\) de 5 % à 1 % : \\(\\alpha\\) diminue mais \\(\\beta\\) augmente. On ne peut pas tout gagner à \\(n\\) fixé.`,`Avec \\(\\mu_1=499{,}5\\), cliquez plusieurs fois sur « Tirer un échantillon » : on rate souvent le sous-remplissage (puissance faible).`]],[`Certaines fonctions (la log-vraisemblance, l'erreur d'un réseau de neurones) n'ont pas de minimum calculable à la main : on le cherche pas à pas. <b>Descente de gradient</b> : on avance dans le sens opposé à la pente. <b>Newton</b> : on remplace \\(f\\) par sa parabole locale et on saute à son minimum. 15 itérations sont simulées. \\[\\theta_{k+1}=\\theta_k-\\eta\\,f'(\\theta_k)\\quad\\text{(gradient)},\\qquad \\theta_{k+1}=\\theta_k-\\frac{f'(\\theta_k)}{f''(\\theta_k)}\\quad\\text{(Newton)}\\]`,`Axe horizontal : \\(\\theta\\). Courbe bleue : \\(f(\\theta)\\). Point vert : départ \\(\\theta_0\\). Points rouges : itérations successives, reliées par un trait.`,[`<b>Fonction</b> : \\(\\theta^2\\) a un seul minimum (en 0) ; la fonction non convexe a deux creux (un minimum local, un minimum global).`,`<b>Méthode</b> : descente de gradient ou Newton.`,`<b>\\(\\eta\\)</b> : longueur du pas de la descente (sans effet sur Newton).`,`<b>\\(\\theta_0\\)</b> : point de départ.`],[`Sur \\(\\theta^2\\) avec descente : \\(\\eta=0{,}1\\) converge lentement ; \\(\\eta=0{,}5\\) tombe sur 0 en une étape ; \\(\\eta=1{,}1\\) diverge.`,`Passez à Newton sur \\(\\theta^2\\) : une seule étape suffit.`,`Fonction non convexe : essayez \\(\\theta_0=-2\\) puis \\(\\theta_0=2\\) : on tombe dans des creux différents. Un minimum local n'est pas forcément le meilleur.`,`Pas trop grand ⇒ divergence ; pas trop petit ⇒ lenteur.`]],[`On veut estimer une moyenne (vraie valeur 4) en ne regardant qu'<b>une observation à la fois</b> (descente de gradient stochastique). À chaque nouvelle observation \\(z_k\\), on corrige l'estimation : \\[\\theta_k=\\theta_{k-1}-\\eta_k\\,(\\theta_{k-1}-z_k)\\] Avec \\(\\eta_k=1/k\\), \\(\\theta_k\\) est exactement la moyenne empirique \\(\\overline Z_k\\). Le choix du pas \\(\\eta\\) décide de la stabilité.`,`Axe horizontal : numéro \\(k\\) de l'observation (1 à 60). Points gris : observations. Courbes : estimation \\(\\theta_k\\). Trait gris : vraie moyenne 4.`,[`<b>Pas constant (rouge)</b> : \\(\\eta\\) fixe. Grand = réagit vite mais très bruité ; petit = lisse mais lent.`,`<b>Nouveaux tirages</b> : génère 60 nouvelles observations.`],[`La courbe bleue (pas \\(1/k\\)) est exactement la moyenne des observations déjà vues : elle se stabilise.`,`La rouge avec \\(\\eta=0{,}5\\) saute à chaque observation et s'agite autour de 4.`,`Avec \\(\\eta=0{,}02\\) elle est très lisse mais met longtemps à rejoindre 4.`,`Lisez la dispersion des 20 dernières itérations dans le résultat.`]],[`Les 80 points proviennent de deux sous-populations (centrées sur 0 et 4, écart-type 1), mais on ignore laquelle a produit chaque point. L'algorithme EM estime les deux moyennes \\(m_1\\) et \\(m_2\\) en répétant : \\[\\textbf{(E)}\\ \\ \\gamma_{ik}=\\frac{\\pi_k f_k(x_i)}{\\pi_1 f_1(x_i)+\\pi_2 f_2(x_i)},\\qquad \\textbf{(M)}\\ \\ m_k=\\frac{\\sum_i\\gamma_{ik}\\,x_i}{\\sum_i\\gamma_{ik}}\\] \\(\\gamma_{ik}\\) est la probabilité que le point \\(i\\) appartienne au groupe \\(k\\) ; chaque moyenne est une moyenne pondérée par ces \\(\\gamma\\).`,`Axe horizontal : valeur des observations. Barres grises : histogramme des données. Courbes bleue et rouge : les deux composantes ; noire : le mélange. Points du bas : observations colorées selon \\(\\gamma_{i1}\\) (bleu = groupe 1, rouge = groupe 2).`,[`<b>\\(m_1,\\ m_2\\)</b> (départ) : valeurs initiales supposées des deux moyennes (bouger un curseur remet l'algorithme à zéro).`,`<b>Générer des données</b> : nouvel échantillon de 80 points.`,`<b>1 itération / 10 itérations</b> : applique les étapes E puis M une ou dix fois.`],[`Cliquez plusieurs fois sur « 1 itération » : les courbes bleue et rouge glissent vers les deux nuages de points.`,`Observez les couleurs : les points entre les deux groupes sont mélangés (\\(\\gamma\\) proche de 0,5).`,`La log-vraisemblance ne fait qu'augmenter.`,`Essayez des départs identiques (\\(m_1=m_2\\)) : l'algorithme reste bloqué, car tous les points sont attribués à parts égales.`]]];
$('main').innerHTML=S.map((s,i)=>{const g=G[i];return `<section id=s${i} hidden><h2>${s[1]}</h2><div class=ref>${s[2]} du cours</div><div class=bx><b>🎯 De quoi parle-t-on ?</b><br>${g[0]}<br><i>📈 Graphique : ${g[1]}</i></div><div class=bx><b>🎛️ Les paramètres</b><ul>${g[2].map(t=>`<li>${t}</li>`).join('')}</ul></div><div class=c>${s[4]}</div>${s[5]}<div class=rt>📖 Résultat chiffré de la simulation en cours</div><div class=o id=${s[6]}></div>${i==5?'<div class=o id=o6b></div>':''}<div class=bx><b>👀 Sur quoi vous concentrer</b><ol>${g[3].map(t=>`<li>${t}</li>`).join('')}</ol></div></section>`}).join('');
const R=[f1,f2,f3,f4,f5,f6,f7,f8,r9];let cur=0;
function mj(){if(window.MathJax&&MathJax.typesetPromise){const e=[$('o'+(cur+1)),$('o6b'),...document.querySelectorAll('#s'+cur+' .lgd')].filter(Boolean);MathJax.typesetPromise(e).catch(()=>{})}}
